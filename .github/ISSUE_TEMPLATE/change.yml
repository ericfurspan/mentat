name: Change
description: Something to build, fix or decide.
body:
  - type: textarea
    id: what
    attributes:
      label: What
      description: What should change.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem it solves or what it makes possible.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: How we will know it is done
      description: What you will be able to see or run when it works.
    validations:
      required: true
  - type: textarea
    id: not-in-scope
    attributes:
      label: Not in scope
      description: What this should leave alone, even if it looks related.
    validations:
      required: false

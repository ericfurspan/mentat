<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 390" width="420" height="390" role="img" aria-label="You triage Inbox ideas into Backlog. Backlog items and chat requests get a Codex and Grok second opinion. Your agreement moves the item to Todo. Then build, Codex and Grok review, and your merge.">
  <style>
    .gb { fill: #F1EFE8; stroke: #888780; stroke-width: 1; }
    .gt { fill: #2C2C2A; }
    .gs { fill: #5F5E5A; }
    .tb { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 1; }
    .tt { fill: #085041; }
    .ts { fill: #0F6E56; }
    .ab { fill: #FAEEDA; stroke: #854F0B; stroke-width: 1; }
    .at { fill: #633806; }
    .as { fill: #854F0B; }
    .l { stroke: #6b7280; stroke-width: 1.2; fill: none; }
    .lt { fill: #6b7280; }
    .mk { stroke: #6b7280; }
    @media (prefers-color-scheme: dark) {
      .gb { fill: #2C2C2A; stroke: #888780; }
      .gt { fill: #F1EFE8; }
      .gs { fill: #B4B2A9; }
      .tb { fill: #085041; stroke: #5DCAA5; }
      .tt { fill: #E1F5EE; }
      .ts { fill: #9FE1CB; }
      .ab { fill: #633806; stroke: #FAC775; }
      .at { fill: #FAEEDA; }
      .as { fill: #FAC775; }
      .l { stroke: #9ca3af; }
      .lt { fill: #9ca3af; }
      .mk { stroke: #9ca3af; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mk" d="M 1 1 L 9 5 L 1 9" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="central">
    <rect class="gb" x="10" y="12" width="120" height="52" rx="8"/>
    <text class="gt" x="70" y="30" font-size="14" font-weight="600">Inbox</text>
    <text class="gs" x="70" y="48" font-size="12" font-weight="400">ideas</text>
    <rect class="ab" x="150" y="12" width="120" height="52" rx="8"/>
    <text class="at" x="210" y="30" font-size="14" font-weight="600">You</text>
    <text class="as" x="210" y="48" font-size="12" font-weight="400">triage: accept</text>
    <rect class="gb" x="290" y="12" width="120" height="52" rx="8"/>
    <text class="gt" x="350" y="38" font-size="14" font-weight="600">Backlog</text>
    <rect class="gb" x="10" y="100" width="120" height="52" rx="8"/>
    <text class="gt" x="70" y="126" font-size="14" font-weight="600">Chat request</text>
    <rect class="tb" x="150" y="100" width="120" height="52" rx="8"/>
    <text class="tt" x="210" y="118" font-size="14" font-weight="600">Codex, Grok</text>
    <text class="ts" x="210" y="136" font-size="12" font-weight="400">second opinion</text>
    <rect class="ab" x="290" y="100" width="120" height="52" rx="8"/>
    <text class="at" x="350" y="118" font-size="14" font-weight="600">You</text>
    <text class="as" x="350" y="136" font-size="12" font-weight="400">agree a spec</text>
    <rect class="gb" x="290" y="188" width="120" height="52" rx="8"/>
    <text class="gt" x="350" y="206" font-size="14" font-weight="600">Todo</text>
    <text class="gs" x="350" y="224" font-size="12" font-weight="400">build now or later</text>
    <rect class="gb" x="150" y="188" width="120" height="52" rx="8"/>
    <text class="gt" x="210" y="214" font-size="14" font-weight="600">Build</text>
    <rect class="tb" x="10" y="188" width="120" height="52" rx="8"/>
    <text class="tt" x="70" y="206" font-size="14" font-weight="600">Codex, Grok</text>
    <text class="ts" x="70" y="224" font-size="12" font-weight="400">code review</text>
    <rect class="ab" x="10" y="276" width="120" height="52" rx="8"/>
    <text class="at" x="70" y="294" font-size="14" font-weight="600">You</text>
    <text class="as" x="70" y="312" font-size="12" font-weight="400">merge</text>
    <path class="l" d="M 132 38 L 148 38" marker-end="url(#a)"/>
    <path class="l" d="M 272 38 L 288 38" marker-end="url(#a)"/>
    <path class="l" d="M 314 66 L 314 82 L 236 82 L 236 98" stroke-linejoin="round" marker-end="url(#a)"/>
    <path class="l" d="M 132 126 L 148 126" marker-end="url(#a)"/>
    <path class="l" d="M 272 126 L 288 126" marker-end="url(#a)"/>
    <path class="l" d="M 350 154 L 350 186" marker-end="url(#a)"/>
    <path class="l" d="M 288 214 L 272 214" marker-end="url(#a)"/>
    <path class="l" d="M 148 214 L 132 214" marker-end="url(#a)"/>
    <path class="l" d="M 70 242 L 70 274" marker-end="url(#a)"/>
    <text class="lt" x="210" y="354" font-size="12" font-weight="400">Amber: you. Teal: Codex and Grok, the default checks.</text>
    <text class="lt" x="210" y="374" font-size="12" font-weight="400">Gray: Claude Code and the backlog.</text>
  </g>
</svg>

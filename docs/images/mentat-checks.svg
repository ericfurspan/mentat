<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" role="img" aria-label="A change moves from idea to plan, build, pull request and merge. Codex and Grok give a second opinion on the idea, Codex critiques the plan, and both do the code review. The maintainer requests the change, approves the plan and merges.">
  <style>
    .gb { fill: #F1EFE8; stroke: #888780; stroke-width: 1; }
    .gt { fill: #2C2C2A; }
    .gs { fill: #5F5E5A; }
    .tb { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 1; }
    .tt { fill: #085041; }
    .ts { fill: #0F6E56; }
    .ab { fill: #FAEEDA; stroke: #854F0B; stroke-width: 1; }
    .at { fill: #633806; }
    .as { fill: #854F0B; }
    .l { stroke: #6b7280; stroke-width: 1.2; fill: none; }
    .lt { fill: #6b7280; }
    .dash { stroke: #6b7280; stroke-width: 1; fill: none; stroke-dasharray: 4 4; }
    .mk { stroke: #6b7280; }
    @media (prefers-color-scheme: dark) {
      .gb { fill: #2C2C2A; stroke: #888780; }
      .gt { fill: #F1EFE8; }
      .gs { fill: #B4B2A9; }
      .tb { fill: #085041; stroke: #5DCAA5; }
      .tt { fill: #E1F5EE; }
      .ts { fill: #9FE1CB; }
      .ab { fill: #633806; stroke: #FAC775; }
      .at { fill: #FAEEDA; }
      .as { fill: #FAC775; }
      .l { stroke: #9ca3af; }
      .lt { fill: #9ca3af; }
      .dash { stroke: #9ca3af; }
      .mk { stroke: #9ca3af; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mk" d="M 1 1 L 9 5 L 1 9" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="central">
    <rect class="tb" x="40" y="40" width="104" height="56" rx="8"/>
    <text class="tt" x="92" y="59" font-size="14" font-weight="600">Codex, Grok</text>
    <text class="ts" x="92" y="79" font-size="12" font-weight="400">second opinion</text>
    <rect class="tb" x="164" y="40" width="104" height="56" rx="8"/>
    <text class="tt" x="216" y="59" font-size="14" font-weight="600">Codex</text>
    <text class="ts" x="216" y="79" font-size="12" font-weight="400">critiques plan</text>
    <rect class="tb" x="412" y="40" width="104" height="56" rx="8"/>
    <text class="tt" x="464" y="59" font-size="14" font-weight="600">Codex, Grok</text>
    <text class="ts" x="464" y="79" font-size="12" font-weight="400">code review</text>
    <rect class="gb" x="40" y="128" width="104" height="44" rx="8"/>
    <text class="gt" x="92" y="150" font-size="14" font-weight="600">Idea</text>
    <rect class="gb" x="164" y="128" width="104" height="44" rx="8"/>
    <text class="gt" x="216" y="150" font-size="14" font-weight="600">Plan</text>
    <rect class="gb" x="288" y="128" width="104" height="44" rx="8"/>
    <text class="gt" x="340" y="150" font-size="14" font-weight="600">Build</text>
    <rect class="gb" x="412" y="128" width="104" height="44" rx="8"/>
    <text class="gt" x="464" y="150" font-size="14" font-weight="600">Pull request</text>
    <rect class="gb" x="536" y="128" width="104" height="44" rx="8"/>
    <text class="gt" x="588" y="150" font-size="14" font-weight="600">Merged</text>
    <rect class="ab" x="40" y="204" width="104" height="56" rx="8"/>
    <text class="at" x="92" y="223" font-size="14" font-weight="600">Maintainer</text>
    <text class="as" x="92" y="243" font-size="12" font-weight="400">requests</text>
    <rect class="ab" x="164" y="204" width="104" height="56" rx="8"/>
    <text class="at" x="216" y="223" font-size="14" font-weight="600">Maintainer</text>
    <text class="as" x="216" y="243" font-size="12" font-weight="400">approves plan</text>
    <rect class="ab" x="536" y="204" width="104" height="56" rx="8"/>
    <text class="at" x="588" y="223" font-size="14" font-weight="600">Maintainer</text>
    <text class="as" x="588" y="243" font-size="12" font-weight="400">merges</text>
    <path class="l" d="M 92 98 L 92 126" marker-end="url(#a)"/>
    <path class="l" d="M 216 98 L 216 126" marker-end="url(#a)"/>
    <path class="l" d="M 464 98 L 464 126" marker-start="url(#a)" marker-end="url(#a)"/>
    <path class="l" d="M 146 150 L 162 150" marker-end="url(#a)"/>
    <path class="l" d="M 270 150 L 286 150" marker-end="url(#a)"/>
    <path class="l" d="M 394 150 L 410 150" marker-end="url(#a)"/>
    <path class="l" d="M 518 150 L 534 150" marker-end="url(#a)"/>
    <path class="l" d="M 92 202 L 92 174" marker-end="url(#a)"/>
    <path class="l" d="M 216 202 L 216 174" marker-end="url(#a)"/>
    <path class="l" d="M 588 202 L 588 174" marker-end="url(#a)"/>
    <text class="lt" x="340" y="296" font-size="12" font-weight="400">Gray: Claude Code's work. Teal: other vendors' models. Amber: the maintainer.</text>
  </g>
</svg>

    <text class="t" x="450" y="175" text-anchor="start">Claude Code builds</text>
    <text class="t" x="320" y="316" text-anchor="middle">Codex and Grok review</text>
    <text class="mt" x="190" y="175" text-anchor="end" font-weight="600">Maintainer merges</text>
    <text class="lt" x="298" y="256" text-anchor="end" font-size="13">fixes</text>

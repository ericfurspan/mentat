      .lt { fill: #9ca3af; }
      .m { stroke: #fbbf24; }
      .mt { fill: #fbbf24; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="l" d="M 1 1 L 9 5 L 1 9" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="m" d="M 1 1 L 9 5 L 1 9" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-width="2.2">
    <path class="l" d="M 339.1 61.7 A 110 110 0 0 1 428.3 150.9" marker-end="url(#a)"/>
    <path class="l" d="M 428.3 189.1 A 110 110 0 0 1 339.1 278.3" marker-end="url(#a)"/>
    <path class="l" d="M 300.9 278.3 A 110 110 0 0 1 211.7 189.1" marker-end="url(#a)"/>
    <path class="m" d="M 211.7 150.9 A 110 110 0 0 1 300.9 61.7" stroke-width="3.2" marker-end="url(#m)"/>
    <path class="l" d="M 311 265 A 16 16 0 1 1 329 265" stroke-width="1.8" marker-end="url(#a)"/>
  </g>
  <g stroke-width="2.2">
